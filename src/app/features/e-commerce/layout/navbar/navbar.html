<p-menubar [model]="items()" styleClass="premium-navbar">

  <ng-template pTemplate="start">
    <img
      [src]="logoSrc()"
      alt="MyShop"
      class="logo"
      routerLink="/home"
      loading="lazy"
      decoding="async"
    />
  </ng-template>

  <ng-template pTemplate="end">
    <div class="nav-actions">
      <p-button
        icon="pi pi-shopping-cart"
        [badge]="cartCount() > 0 ? cartCount().toString() : undefined"
        badgeSeverity="danger"
        [text]="true"
        severity="secondary"
        class="cart-btn"
        routerLink="/cart"
      />

      @if (isAuthenticated()) {
        <div class="user-profile" (click)="menu.toggle($event)" role="button" tabindex="0" (keydown.enter)="menu.toggle($event)">
          <span class="user-name font-medium">Hello, {{ currentUser()?.['name'] || 'User' }}</span>
          <p-button
            icon="pi pi-user"
            severity="secondary"
            [rounded]="true"
            [text]="true"
            aria-label="User Profile"
            class="profile-btn"
            tabindex="-1"
          />
        </div>
        <p-menu #menu [model]="profileItems()" [popup]="true" appendTo="body" styleClass="premium-menu"></p-menu>
      } @else {
        <div class="auth-buttons">
          @if (currentUser()?.['role'] === 'admin') {
            <p-button
              label="Admin Dashboard"
              icon="pi pi-chart-bar"
              severity="primary"
              class="admin-dashboard-btn"
              routerLink="/admin"
            />
            <p-button
              label="Logout"
              icon="pi pi-sign-out"
              severity="danger"
              [outlined]="true"
              class="logout-btn"
              (onClick)="logout()"
            />
          } @else {
            <p-button
              label="Log In"
              icon="pi pi-sign-in"
              severity="secondary"
              [outlined]="true"
              class="login-btn"
              routerLink="/login"
            />

            <p-button
              label="Get Started"
              icon="pi pi-bolt"
              severity="contrast"
              class="signup-btn"
              routerLink="/signup"
            />
          }
        </div>
      }
    </div>
  </ng-template>

</p-menubar>
